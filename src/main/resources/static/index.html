<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Meeting Room Co-Pilot</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

    <div class="max-w-lg mx-auto bg-white p-6 rounded shadow border border-gray-200">
        <h1 class="text-xl font-bold mb-1">Smart Meeting Room Co-Pilot</h1>
        <p class="text-sm text-gray-600 mb-6">Select an available room and fill out the form below to book.</p>

        <!-- Room Availability Section -->
        <h2 class="text-base font-semibold mb-3">Available Rooms</h2>
        <div id="loading" class="text-sm text-gray-500 mb-4">Loading rooms...</div>
        <div id="room-list" class="space-y-2 mb-6"></div>

        <hr class="my-6 border-gray-200">

        <!-- Booking Form Section -->
        <h2 class="text-base font-semibold mb-3">Create Booking</h2>
        <div id="message" class="mb-4 p-3 rounded text-sm hidden"></div>

        <form id="bookingForm" class="space-y-4">
            <div>
                <label for="roomId" class="block text-sm font-medium text-gray-700 mb-1">Selected Room:</label>
                <input type="text" id="roomId" required readonly placeholder="Click 'Select' on a room above"
                       class="w-full p-2 border border-gray-300 rounded text-sm bg-gray-50 text-gray-700 cursor-not-allowed">
            </div>

            <div>
                <label for="organizer" class="block text-sm font-medium text-gray-700 mb-1">Organizer:</label>
                <input type="text" id="organizer" required placeholder="e.g. Frank"
                       class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label for="startTime" class="block text-sm font-medium text-gray-700 mb-1">Start Time:</label>
                <input type="datetime-local" id="startTime" required 
                       class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label for="endTime" class="block text-sm font-medium text-gray-700 mb-1">End Time:</label>
                <input type="datetime-local" id="endTime" required 
                       class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label for="attendeeCount" class="block text-sm font-medium text-gray-700 mb-1">Attendee Count:</label>
                <input type="number" id="attendeeCount" required min="1" placeholder="e.g. 4"
                       class="w-full p-2 border border-gray-300 rounded text-sm focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 text-white p-2 rounded text-sm font-medium hover:bg-blue-700 transition-colors cursor-pointer">
                Submit Booking
            </button>
        </form>
    </div>

    <script>
        const mockRooms = [
            { id: 1, name: 'Room A', capacity: 6, isAvailable: true },
            { id: 2, name: 'Room B', capacity: 10, isAvailable: false },
            { id: 3, name: 'Room C', capacity: 4, isAvailable: true },
            { id: 4, name: 'Room D', capacity: 12, isAvailable: true },
            { id: 5, name: 'Conference Suite 1', capacity: 20, isAvailable: false }
        ];

        let selectedNumericRoomId = null;

        async function loadRooms() {
            try {
                const response = await fetch('/api/rooms');
                if (!response.ok) throw new Error('API unavailable');
                const rooms = await response.json();
                renderRooms(rooms);
            } catch (error) {
                setTimeout(() => renderRooms(mockRooms), 200);
            }
        }

        function renderRooms(rooms) {
            const list = document.getElementById('room-list');
            const loading = document.getElementById('loading');
            
            list.innerHTML = '';
            loading.style.display = 'none';

            rooms.forEach(room => {
                const card = document.createElement('div');
                card.className = 'flex justify-between items-center p-3 border border-gray-200 rounded bg-gray-50 text-sm';
                
                const safeRoomName = room.name.replace(/'/g, "\\'");

                card.innerHTML = `
                    <div>
                        <span class="font-bold text-gray-800">${room.name}</span> (Capacity: ${room.capacity})<br>
                        <span class="${room.isAvailable ? 'text-green-600 font-medium' : 'text-red-600 font-medium'}">
                            ${room.isAvailable ? 'Available' : 'Occupied'}
                        </span>
                    </div>
                    <button type="button" 
                        onclick="selectRoom(${room.id}, '${safeRoomName}', ${room.isAvailable})" 
                        class="px-3 py-1.5 rounded text-xs font-medium ${
                            room.isAvailable 
                                ? 'bg-green-600 text-white hover:bg-green-700 cursor-pointer' 
                                : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                        }"
                        ${!room.isAvailable ? 'disabled' : ''}>
                        ${room.isAvailable ? 'Select' : 'Booked'}
                    </button>
                `;
                list.appendChild(card);
            });
        }

        function selectRoom(id, roomName, isAvailable) {
            if (!isAvailable) return;
            selectedNumericRoomId = id;
            document.getElementById('roomId').value = roomName;
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const msgBox = document.getElementById('message');
            msgBox.classList.add('hidden');
            msgBox.textContent = '';

            if (!selectedNumericRoomId) {
                msgBox.textContent = 'Please select an available room from the list above first.';
                msgBox.className = 'mb-4 p-3 rounded text-sm bg-red-100 text-red-800 border border-red-200';
                msgBox.classList.remove('hidden');
                return;
            }

            const startTime = document.getElementById('startTime').value;
            const endTime = document.getElementById('endTime').value;

            // Acceptance criteria: End time must be after start time
            if (new Date(endTime) <= new Date(startTime)) {
                msgBox.textContent = 'Validation Error: End time must be after start time.';
                msgBox.className = 'mb-4 p-3 rounded text-sm bg-red-100 text-red-800 border border-red-200';
                msgBox.classList.remove('hidden');
                return;
            }

            const payload = {
                roomId: Number(selectedNumericRoomId),
                organizer: document.getElementById('organizer').value,
                startTime: startTime,
                endTime: endTime,
                attendeeCount: parseInt(document.getElementById('attendeeCount').value)
            };

            try {
                const response = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    let errorMsg = 'Failed to create booking.';
                    try {
                        const errData = await response.json();
                        errorMsg = errData.message || errData.error || errorMsg;
                    } catch (parseErr) {}
                    throw new Error(errorMsg);
                }

                let bookingId = '';
                try {
                    const data = await response.json();
                    bookingId = data.id || data.bookingId || '';
                } catch (parseErr) {}

                // Acceptance criteria: Success message displayed
                msgBox.textContent = bookingId ? `Success! Booking ID: ${bookingId}` : 'Success! Meeting room booked successfully.';
                msgBox.className = 'mb-4 p-3 rounded text-sm bg-green-100 text-green-800 border border-green-200';
                msgBox.classList.remove('hidden');
                
                document.getElementById('bookingForm').reset();
                document.getElementById('roomId').value = '';
                selectedNumericRoomId = null;
                loadRooms();
            } catch (err) {
                // Acceptance criteria: Understandable error message displayed
                msgBox.textContent = err.message;
                msgBox.className = 'mb-4 p-3 rounded text-sm bg-red-100 text-red-800 border border-red-200';
                msgBox.classList.remove('hidden');
            }
        });

        loadRooms();
    </script>
</body>
</html>
